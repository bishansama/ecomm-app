apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config-test
  namespace: ecomm-app
  labels:
    app: notification-service
    environment: test
data:
  SERVER_PORT: "8890"
  SPRING_APPLICATION_NAME: "notification-service"
  SPRING_PROFILES_ACTIVE: "test"
  LOG_LEVEL: "INFO"
  SPRINGDOC_API_DOCS_PATH: "/api-docs"
  SPRINGDOC_SWAGGER_UI_PATH: "/swagger-ui.html"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
  EMAIL_ENABLED: "false"
  SMS_ENABLED: "false"
  PUSH_ENABLED: "false"
  IN_APP_ENABLED: "true"
  NOTIFICATION_RETRY_ATTEMPTS: "1"
  NOTIFICATION_TIMEOUT: "10"
  MOCK_NOTIFICATIONS: "true"
  application.yml: |
    server:
      port: ${SERVER_PORT:8890}
    
    spring:
      application:
        name: ${SPRING_APPLICATION_NAME:notification-service}
      profiles:
        active: ${SPRING_PROFILES_ACTIVE:test}
    
    logging:
      level:
        root: ${LOG_LEVEL:INFO}
        com.ecommapp.notificationservice: DEBUG
        org.springframework: INFO
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    
    springdoc:
      api-docs:
        path: ${SPRINGDOC_API_DOCS_PATH:/api-docs}
      swagger-ui:
        path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
      packages-to-scan: com.ecommapp.notificationservice.controller
    
    management:
      endpoints:
        web:
          exposure:
            include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
      endpoint:
        health:
          show-details: always
    
    # Notification specific configurations for testing
    notification:
      channels:
        email:
          enabled: ${EMAIL_ENABLED:false}
        sms:
          enabled: ${SMS_ENABLED:false}
        push:
          enabled: ${PUSH_ENABLED:false}
        in-app:
          enabled: ${IN_APP_ENABLED:true}
      retry:
        attempts: ${NOTIFICATION_RETRY_ATTEMPTS:1}
      timeout:
        seconds: ${NOTIFICATION_TIMEOUT:10}
      mock:
        enabled: ${MOCK_NOTIFICATIONS:true}