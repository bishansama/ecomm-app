apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart-service
  namespace: ecomm-app
  labels:
    app: shopping-cart-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping-cart-service
  template:
    metadata:
      labels:
        app: shopping-cart-service
        version: v1
    spec:
      containers:
      - name: shopping-cart-service
        image: shopping-cart-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8084
          name: http
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: shopping-cart-service-config
              key: SERVER_PORT
        - name: SPRING_APPLICATION_NAME
          valueFrom:
            configMapKeyRef:
              name: shopping-cart-service-config
              key: SPRING_APPLICATION_NAME
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: shopping-cart-service-config
              key: SPRING_PROFILES_ACTIVE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: shopping-cart-service-config
              key: LOG_LEVEL
        - name: SPRINGDOC_API_DOCS_PATH
          valueFrom:
            configMapKeyRef:
              name: shopping-cart-service-config
              key: SPRINGDOC_API_DOCS_PATH
        - name: SPRINGDOC_SWAGGER_UI_PATH
          valueFrom:
            configMapKeyRef:
              name: shopping-cart-service-config
              key: SPRINGDOC_SWAGGER_UI_PATH
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config-volume
        configMap:
          name: shopping-cart-service-config
          items:
          - key: application.yml
            path: application.yml
      restartPolicy: Always