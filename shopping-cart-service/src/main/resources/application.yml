server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:shopping-cart-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# OpenAPI Configuration
springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operationsSorter: method
  packages-to-scan: com.ecommapp.shoppingcartservice.controller

# Logging Configuration
logging:
  level:
    com.ecommapp.shoppingcartservice: ${LOG_LEVEL:INFO}
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always